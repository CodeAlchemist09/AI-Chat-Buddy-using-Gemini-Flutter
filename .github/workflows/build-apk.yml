name: Build Flutter APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      
      - uses: actions/setup-java@v4.3.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --debug # Changed from --release to --debug to bypass production signing

      - uses: actions/upload-artifact@v4.6.1
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk # Updated target path to catch the debug binary
